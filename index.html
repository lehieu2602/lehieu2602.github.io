<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
  :root { --bg:#0e0f13; --fg:#e8e6e3; --muted:#8a8f98; --accent:#7cc4a4; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 24px; }
  main { max-width:520px; text-align:center; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block;
         box-shadow:0 0 16px var(--accent); animation:pulse 3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  h1 { font-size:2.2rem; letter-spacing:-.02
  p { color:var(--muted); }
  footer { margin-top:40px; font-size:.85rem; color:var(--muted); }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<main>
  <span class="dot"></span>
  <h1>Hello there.</h1>
  <p>A small personal space on the web. Noth/p>
  <footer><a href="privacy.html">Privacy</a></footer>
</main>
</body>
</html>
